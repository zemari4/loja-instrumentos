name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: test
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key-not-for-production' }}
      DISABLE_CACHE: "True"
      DISABLE_REDIS: "True"
      ENABLE_S3_STORAGE: "False"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Histórico completo: o towncrier check compara o PR com a branch base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Executa a suíte inteira. Não liste diretórios aqui: apps omitidos deixam
      # de ser verificados sem que nada falhe — foi assim que manager/ e orders/,
      # que cobrem controle de acesso e checkout, ficaram fora do CI.
      # DJANGO_SETTINGS_MODULE vem de [tool.pytest.ini_options] no pyproject.toml.
      # O mínimo de cobertura é o fail_under de [tool.coverage.report].
      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing

      # O hook de nome de branch roda em Node, que já vem nos runners.
      - name: Test branch-name hook
        run: node --test .claude/hooks/

      # Todo PR precisa de um fragmento em changelog.d/<nº-da-issue>.<tipo>.md.
      - name: Check changelog fragment
        if: github.event_name == 'pull_request'
        run: towncrier check --compare-with origin/${{ github.base_ref }}
